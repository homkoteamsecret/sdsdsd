<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>end</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #text {
    max-width: 600px;
    padding: 40px;
    font-size: 20px;
    line-height: 2.2;
    letter-spacing: 2px;
    text-align: center;
    white-space: pre-line;
    color: #ff6b9d;
    text-shadow:
      0 0 20px #ff6b9d,
      0 0 40px #ff0044;
    opacity: 0;
    animation: fadeIn 3s ease-in forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  #hint {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: #333;
    font-size: 12px;
    letter-spacing: 4px;
    opacity: 0;
    animation: fadeIn 2s ease-in 4s forwards;
    cursor: pointer;
  }

  #hint:hover { color: #ff6b9d; }
</style>
</head>
<body>

<div id="text">ты прочитал всё.
ты узнал код.

малиновый гастер здесь.
он всегда здесь.

он — малина.

спасибо что был с нами.</div>

<div id="hint">нажми чтобы продолжить</div>

<script>
setTimeout(() => {
  window.location.href = 'about:blank';
}, 15000);

document.addEventListener('click', () => {
  window.location.href = 'about:blank';
});

document.addEventListener('keydown', () => {
  window.location.href = 'about:blank';
});

console.log('%cARG завершён.', 'color: #ff6b9d; font-size: 16px; letter-spacing: 4px;');
console.log('%cспасибо что был с нами.', 'color: #888; font-size: 12px;');
</script>

</body>
</html>
