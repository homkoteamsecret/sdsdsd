<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
    font-family: 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Загадочный текст */
  #piska {
    color: #8b0000;
    font-size: clamp(40px, 12vw, 160px);
    letter-spacing: 20px;
    text-shadow: 0 0 20px #ff0000, 0 0 40px #8b0000, 0 0 80px #ff0000;
    animation: pulse 3s ease-in-out infinite, flicker 0.15s infinite;
    user-select: none;
    pointer-events: none;
    text-transform: lowercase;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50%      { transform: scale(1.05); opacity: 1; }
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.7; }
    92%      { opacity: 0.2; }
  }

  /* Виньетка */
  #vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 20%, #000 90%);
    z-index: 5;
    pointer-events: none;
  }

  /* Красная вспышка */
  #flash {
    position: fixed;
    inset: 0;
    background: #ff0000;
    opacity: 0;
    z-index: 10;
    pointer-events: none;
    animation: flash 6s ease-in-out infinite;
  }

  @keyframes flash {
    0%, 100% { opacity: 0; }
    50%      { opacity: 0.15; }
    92%      { opacity: 0.4; }
  }

  /* Глаза по углам */
  .eye {
    position: fixed;
    width: 30px;
    height: 30px;
    background: radial-gradient(circle, #ff0000 30%, #8b0000 60%, transparent 70%);
    border-radius: 50%;
    opacity: 0.6;
    animation: eyePulse 2s ease-in-out infinite;
    z-index: 15;
    pointer-events: none;
  }

  .eye.tl { top: 5%; left: 5%; }
  .eye.tr { top: 5%; right: 5%; }
  .eye.bl { bottom: 5%; left: 5%; }
  .eye.br { bottom: 5%; right: 5%; }

  @keyframes eyePulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50%      { transform: scale(1.3); opacity: 0.2; }
  }

  /* Тряска при клике */
  .shake { animation: shake 0.1s infinite; }

  @keyframes shake {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(-5px, 3px); }
    50%  { transform: translate(5px, -3px); }
    75%  { transform: translate(-3px, -5px); }
    100% { transform: translate(3px, 5px); }
  }
</style>
