<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: default;
    font-family: 'Courier New', monospace;
  }

  /* --- Фон GIF --- */
  #bg-gif {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    filter: contrast(1.1) brightness(0.85) saturate(1.1);
    pointer-events: none;
  }

  /* --- Мерцание --- */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.02);
    pointer-events: none;
    animation: flicker 5s infinite;
    z-index: 2;
  }

  @keyframes flicker {
    0%, 100% { opacity: 0; }
    48% { opacity: 0; }
    50% { opacity: 1; }
    52% { opacity: 0; }
    88% { opacity: 0; }
    89% { opacity: 1; }
    90% { opacity: 0; }
    91% { opacity: 1; }
    92% { opacity: 0; }
  }

  /* --- Скан-линии --- */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(255,255,255,0.025) 3px,
      rgba(255,255,255,0.025) 4px
    );
    pointer-events: none;
    z-index: 3;
    animation: scanMove 8s linear infinite;
  }

  @keyframes scanMove {
    0% { transform: translateY(0); }
    100% { transform: translateY(4px); }
  }

  /* --- Цветной шум по краям --- */
  #bg-noise {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
    opacity: 0.07;
    mix-blend-mode: screen;
    background: linear-gradient(
      90deg,
      #ff0044 0%,
      transparent 20%,
      transparent 80%,
      #00ffff 100%
    );
    animation: bgShift 6s ease-in-out infinite;
  }

  @keyframes bgShift {
    0%, 100% { transform: translateX(-10%); opacity: 0.05; }
    50% { transform: translateX(10%); opacity: 0.1; }
  }

  /* --- Виньетка --- */
  #vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 4;
    background: radial-gradient(
      ellipse at center,
      transparent 35%,
      rgba(0,0,0,0.75) 100%
    );
  }

  /* --- Бегущая полоса сканера --- */
  #scan-bar {
    position: fixed;
    left: 0;
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,0.08);
    pointer-events: none;
    z-index: 5;
    animation: scanBar 7s linear infinite;
  }

  @keyframes scanBar {
    0% { top: -5%; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { top: 105%; opacity: 0; }
  }

  /* --- Вспышка --- */
  #glitch-flash {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 6;
    background: #fff;
    opacity: 0;
  }

  #glitch-flash.active {
    animation: flash 0.15s ease-out;
  }

  @keyframes flash {
    0% { opacity: 0.15; }
    100% { opacity: 0; }
  }

  /* --- Аудио-контрол --- */
  #audio-control {
    position: fixed;
    bottom: 15px;
    right: 15px;
    color: #333;
    font-size: 11px;
    cursor: pointer;
    z-index: 100;
    transition: color 0.3s;
    user-select: none;
    letter-spacing: 1px;
  }

  #audio-control:hover { color: #888; }
  #audio-control.on { color: #ff6b9d; }
</style>
</head>
<body>

<img id="bg-gif" src="pr.gif" alt="">

<div id="bg-noise"></div>
<div id="vignette"></div>
<div id="scan-bar"></div>
<div id="glitch-flash"></div>

<div id="audio-control">♪ выкл</div>

<audio id="bgMusic" loop crossorigin="anonymous">
  <source src="pr.mp3" type="audio/mpeg">
</audio>

<script>
  const music = document.getElementById('bgMusic');
  const audioControl = document.getElementById('audio-control');
  const glitchFlash = document.getElementById('glitch-flash');

  let audioCtx = null;
  let gainNode = null;
  let sourceNode = null;
  let audioEnabled = false;
  let audioUnlocked = false;

  // ==== Замедление + дисторшн ====
  function makeDistortionCurve(amount) {
    const k = amount;
    const n = 44100;
    const curve = new Float32Array(n);
    const deg = Math.PI / 180;
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
    }
    return curve;
  }

  function initAudioChain() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaElementSource(music);

    music.playbackRate = 0.78;
    if ('preservesPitch' in music) music.preservesPitch = false;
    if ('mozPreservesPitch' in music) music.mozPreservesPitch = false;
    if ('webkitPreservesPitch' in music) music.webkitPreservesPitch = false;

    const distortion = audioCtx.createWaveShaper();
    distortion.curve = makeDistortionCurve(18);
    distortion.oversample = '4x';

    const lowpass = audioCtx.createBiquadFilter();
    lowpass.type = 'lowpass';
    lowpass.frequency.value = 3200;
    lowpass.Q.value = 0.7;

    const highpass = audioCtx.createBiquadFilter();
    highpass.type = 'highpass';
    highpass.frequency.value = 60;

    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0;

    sourceNode.connect(distortion);
    distortion.connect(lowpass);
    lowpass.connect(highpass);
    highpass.connect(gainNode);
    gainNode.connect(audioCtx.destination);
  }

  function fadeIn() {
    if (!gainNode || !audioCtx) return;
    const now = audioCtx.currentTime;
    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(gainNode.gain.value, now);
    gainNode.gain.linearRampToValueAtTime(0.5, now + 4);
  }

  function enableAudio() {
    if (audioEnabled) return;
    audioEnabled = true;
    audioControl.classList.add('on');
    audioControl.textContent = '♪ вкл';
    fadeIn();
  }

  function startPlayback() {
    initAudioChain();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const p = music.play();
    if (p !== undefined) {
      p.then(() => {
        audioUnlocked = true;
        enableAudio();
        window.removeEventListener('mousemove', unlockAudio);
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('keydown', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
        window.removeEventListener('scroll', unlockAudio);
      }).catch(() => {});
    }
  }

  function unlockAudio() {
    if (audioUnlocked) return;
    startPlayback();
  }

  window.addEventListener('mousemove', unlockAudio);
  window.addEventListener('click', unlockAudio);
  window.addEventListener('keydown', unlockAudio);
  window.addEventListener('touchstart', unlockAudio);
  window.addEventListener('scroll', unlockAudio);

  (function tryAutoPlay() {
    initAudioChain();
    const p = music.play();
    if (p !== undefined) {
      p.then(() => { audioUnlocked = true; enableAudio(); }).catch(() => {});
    }
  })();

  audioControl.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!audioCtx) initAudioChain();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (audioEnabled) {
      music.pause();
      audioEnabled = false;
      audioControl.classList.remove('on');
      audioControl.textContent = '♪ выкл';
    } else {
      startPlayback();
    }
  });

  // ==== Глитч ====
  function triggerFlash(intensity) {
    glitchFlash.style.background = `rgba(255,255,255,${intensity})`;
    glitchFlash.classList.remove('active');
    void glitchFlash.offsetWidth;
    glitchFlash.classList.add('active');
  }

  function randomGlitch() {
    if (Math.random() < 0.5) {
      triggerFlash(0.02 + Math.random() * 0.05);
    }
    const bgNoise = document.getElementById('bg-noise');
    if (Math.random() < 0.3) {
      bgNoise.style.opacity = (0.03 + Math.random() * 0.09).toFixed(3);
      setTimeout(() => {
        bgNoise.style.opacity = '0.07';
      }, 300 + Math.random() * 500);
    }
    setTimeout(randomGlitch, 2000 + Math.random() * 5000);
  }
  randomGlitch();
</script>

</body>
</html>
