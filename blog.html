<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    background: #000;
    overflow-x: hidden;
    font-family: 'Courier New', monospace;
    cursor: default;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.015);
    pointer-events: none;
    animation: flicker 5s infinite;
    z-index: 1;
  }

  @keyframes flicker {
    0%, 100% { opacity: 0; }
    48% { opacity: 0; }
    50% { opacity: 1; }
    52% { opacity: 0; }
    88% { opacity: 0; }
    89% { opacity: 1; }
    90% { opacity: 0; }
    91% { opacity: 1; }
    92% { opacity: 0; }
  }

  #vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
    background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.95) 100%);
  }

  #scanlines {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(255,255,255,0.03) 3px,
      rgba(255,255,255,0.03) 4px
    );
  }

  #container {
    position: relative;
    z-index: 10;
    max-width: 700px;
    margin: 0 auto;
    padding: 80px 40px;
  }

  #header {
    color: #444;
    font-size: 14px;
    letter-spacing: 8px;
    text-align: center;
    margin-bottom: 80px;
    animation: pulse 3s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }

  .post {
    margin-bottom: 60px;
    opacity: 0;
    transition: opacity 1.5s ease;
  }

  .post.visible {
    opacity: 1;
  }

  .post-date {
    color: #333;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 15px;
  }

  .post-text {
    color: #ccc;
    font-size: 16px;
    line-height: 2;
    white-space: pre-wrap;
  }

  .post-text.pink {
    color: #ff6b9d;
  }

  .post-text.gray {
    color: #555;
  }

  .post-text.red {
    color: #ff5555;
  }

  .post-text.yellow {
    color: #ffeb3b;
  }

  #back {
    display: block;
    text-align: center;
    color: #333;
    font-size: 12px;
    letter-spacing: 4px;
    text-decoration: none;
    margin-top: 100px;
    transition: color 0.3s;
  }

  #back:hover {
    color: #ff6b9d;
  }

  #audio-control {
    position: fixed;
    bottom: 15px;
    right: 15px;
    color: #222;
    font-size: 11px;
    cursor: pointer;
    z-index: 100;
    transition: color 0.3s;
    user-select: none;
    font-family: 'Courier New', monospace;
  }

  #audio-control:hover { color: #666; }
  #audio-control.on { color: #ff6b9d; }
</style>
</head>
<body>

<div id="vignette"></div>
<div id="scanlines"></div>

<div id="container">
  <div id="header">undraeel</div>
  <div id="posts"></div>
  <a href="/" id="back">← назад</a>
</div>

<div id="audio-control">♪ выкл</div>

<audio id="bgMusic" loop>
  <source src="man.mp3" type="audio/mpeg">
</audio>

<script>
  let audioEnabled = false;
  let audioUnlocked = false;
  let posts = [];

  const music = document.getElementById('bgMusic');
  const audioControl = document.getElementById('audio-control');
  const postsContainer = document.getElementById('posts');

  // ===== ЗАГРУЗКА ПОСТОВ =====
  fetch('posts.json')
    .then(response => response.json())
    .then(data => {
      posts = data;
      renderPosts();
    })
    .catch(() => {
      postsContainer.innerHTML = '<div class="post-text gray">...</div>';
    });

  function renderPosts() {
    posts.forEach((post, index) => {
      const div = document.createElement('div');
      div.className = 'post';
      
      let className = 'post-text';
      if (post.color === 'pink') className += ' pink';
      if (post.color === 'gray') className += ' gray';
      if (post.color === 'red') className += ' red';
      if (post.color === 'yellow') className += ' yellow';

      div.innerHTML = `
        <div class="post-date">${post.date} — ${post.time}</div>
        <div class="${className}">${post.text}</div>
      `;
      
      postsContainer.appendChild(div);
      
      setTimeout(() => {
        div.classList.add('visible');
      }, 300 + index * 400);
    });
  }

  // ===== АУДИО =====
  music.volume = 0;

  function tryAutoPlay() {
    music.volume = 0;
    const p = music.play();
    if (p !== undefined) {
      p.then(() => {
        audioEnabled = true;
        audioUnlocked = true;
        audioControl.classList.add('on');
        audioControl.textContent = '♪ вкл';
        fadeIn();
      }).catch(() => { audioEnabled = false; });
    }
  }

  function fadeIn() {
    let vol = 0;
    const fade = setInterval(() => {
      vol += 0.02;
      if (vol >= 0.3) { vol = 0.3; clearInterval(fade); }
      music.volume = vol;
    }, 100);
  }

  function unlockAudio() {
    if (audioUnlocked) return;
    const p = music.play();
    if (p !== undefined) {
      p.then(() => {
        audioUnlocked = true;
        audioEnabled = true;
        audioControl.classList.add('on');
        audioControl.textContent = '♪ вкл';
        fadeIn();
        window.removeEventListener('mousemove', unlockAudio);
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('keydown', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
        window.removeEventListener('scroll', unlockAudio);
      }).catch(() => {});
    }
  }

  window.addEventListener('mousemove', unlockAudio);
  window.addEventListener('click', unlockAudio);
  window.addEventListener('keydown', unlockAudio);
  window.addEventListener('touchstart', unlockAudio);
  window.addEventListener('scroll', unlockAudio);

  tryAutoPlay();

  audioControl.addEventListener('click', (e) => {
    e.stopPropagation();
    if (audioEnabled) {
      music.pause();
      audioEnabled = false;
      audioControl.classList.remove('on');
      audioControl.textContent = '♪ выкл';
    } else {
      music.play().then(() => {
        audioEnabled = true;
        audioControl.classList.add('on');
        audioControl.textContent = '♪ вкл';
      }).catch(() => {});
    }
  });
</script>

</body>
</html>
