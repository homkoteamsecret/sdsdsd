<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>kris</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: default;
  }

  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.95) 100%);
  }

  #scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(255,255,255,0.03) 3px,
      rgba(255,255,255,0.03) 4px
    );
  }

  #scene {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #kris {
    position: relative;
    width: 300px;
    height: auto;
    animation: krisBob 2s ease-in-out infinite;
    filter:
      drop-shadow(0 0 20px #ff6600)
      drop-shadow(0 0 40px #ff3300);
    z-index: 5;
  }

  @keyframes krisBob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-8px) rotate(1deg); }
  }

  #body {
    position: relative;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    user-select: none;
    -webkit-user-drag: none;
    z-index: 1;
  }

  #fire {
    position: absolute;
    top: 0px;
    left: 50%;
    transform: translateX(-50%);
    width: 340px;         /* больше — под череп */
    height: 260px;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at center,
      rgba(255,220,100,0.95) 0%,
      rgba(255,140,0,0.8) 25%,
      rgba(255,60,0,0.5) 55%,
      rgba(255,0,0,0.2) 75%,
      transparent 90%);
    filter: blur(18px);
    animation: fireFlicker 0.25s infinite alternate;
    border-radius: 50%;
  }

  @keyframes fireFlicker {
    0%   { transform: translateX(-50%) scale(1) skewX(-3deg); opacity: 0.85; }
    100% { transform: translateX(-50%) scale(1.1) skewX(3deg); opacity: 1; }
  }

  /* ЧЕРЕП — БОЛЬШОЙ, ПОЛНОСТЬЮ ЗАКРЫВАЕТ ГОЛОВУ КРИСА */
  #head {
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;         /* БОЛЬШЕ — перекрывает голову полностью */
    height: auto;
    image-rendering: pixelated;
    user-select: none;
    -webkit-user-drag: none;
    z-index: 3;
    animation: headShake 0.5s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 10px #000) drop-shadow(0 0 30px #ff3300);
  }

  @keyframes headShake {
    0%   { transform: translateX(-50%) rotate(-3deg); }
    100% { transform: translateX(-50%) rotate(3deg); }
  }

  /* БАНАН — БОЛЬШЕ */
  #banan {
    position: absolute;
    top: -200px;
    left: 50%;
    width: 130px;         /* БОЛЬШЕ */
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
    z-index: 6;
    pointer-events: none;
    filter: drop-shadow(0 0 20px #ffdd00);
    animation: bananFall 4s linear infinite;
  }

  @keyframes bananFall {
    0%   { top: -200px; transform: translateX(-50%) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    70%  { top: 40%;  transform: translateX(-50%) rotate(360deg); opacity: 1; }
    75%  { top: 40%;  transform: translateX(-50%) rotate(360deg) scale(1.4); opacity: 1; }
    85%  { top: 40%;  transform: translateX(-50%) rotate(360deg) scale(0); opacity: 0; }
    100% { top: -200px; transform: translateX(-50%) rotate(0deg); opacity: 0; }
  }

  #title {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: #ff6600;
    font-size: 24px;
    letter-spacing: 8px;
    text-shadow:
      0 0 10px #ff6600,
      0 0 20px #ff3300,
      0 0 40px #ff0000;
    z-index: 20;
    animation: titlePulse 2s ease-in-out infinite;
  }

  @keyframes titlePulse {
    0%, 100% {
      text-shadow:
        0 0 10px #ff6600,
        0 0 20px #ff3300;
    }
    50% {
      text-shadow:
        0 0 20px #ff6600,
        0 0 40px #ff3300,
        0 0 80px #ff0000;
    }
  }

  #subtitle {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-size: 13px;
    letter-spacing: 4px;
    text-align: center;
    z-index: 20;
    opacity: 0;
    animation: fadeIn 2s ease-in 1s forwards;
    white-space: pre-line;
    line-height: 2;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
</style>
</head>
<body>

<div id="vignette"></div>
<div id="scanlines"></div>

<div id="title">КРИС</div>

<div id="scene">
  <div id="kris">
    <div id="fire"></div>
    <img id="body" src="kris.png" alt="">
    <img id="head" src="head.png" alt="">
  </div>
  <img id="banan" src="banan.gif" alt="">
</div>

<div id="subtitle">он видел как она ушла.
он не помог.
не мог.

он ловит бананы.</div>

<script>
console.log('%cКРИС', 'color: #ff6600; font-size: 20px; font-weight: bold; letter-spacing: 4px;');
console.log('%cон видел.', 'color: #888; font-size: 12px;');
console.log('%cон не помог.', 'color: #888; font-size: 12px;');
console.log('%cон ловит бананы.', 'color: #ff6600; font-size: 12px;');
</script>

</body>
</html>
