<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  #bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: 1;
    opacity: 0.7;
  }

  #vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
  }

  #scanlines {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(255,255,255,0.03) 3px,
      rgba(255,255,255,0.03) 4px
    );
  }

  #audio-control {
    position: fixed;
    bottom: 15px;
    right: 15px;
    color: #333;
    font-size: 12px;
    cursor: pointer;
    z-index: 100;
    transition: color 0.3s;
    user-select: none;
    font-family: 'Courier New', monospace;
  }

  #audio-control:hover { color: #888; }
  #audio-control.on { color: #ff6b9d; }
</style>
</head>
<body>

<video id="bg-video" autoplay muted loop playsinline preload="auto">
  <source src="depths_fone.mp4" type="video/mp4">
</video>

<div id="vignette"></div>
<div id="scanlines"></div>

<div id="audio-control">♪ выкл</div>

<audio id="bgMusic" loop>
  <source src="depths.mp3" type="audio/mpeg">
</audio>

<script>
  let audioEnabled = false;
  let audioUnlocked = false;

  const music = document.getElementById('bgMusic');
  const audioControl = document.getElementById('audio-control');
  const video = document.getElementById('bg-video');

  music.volume = 0;

  // ===== ПРОВЕРКА ВИДЕО =====
  video.addEventListener('loadeddata', () => {
    console.log('video loaded:', video.videoWidth, 'x', video.videoHeight);
  });
  video.addEventListener('error', (e) => {
    console.error('video error:', e);
  });

  // ===== АУДИО =====
  function tryAutoPlay() {
    music.volume = 0;
    const p = music.play();
    if (p !== undefined) {
      p.then(() => {
        audioEnabled = true;
        audioUnlocked = true;
        audioControl.classList.add('on');
        audioControl.textContent = '♪ вкл';
        fadeIn();
      }).catch(() => { audioEnabled = false; });
    }
  }

  function fadeIn() {
    let vol = 0;
    const fade = setInterval(() => {
      vol += 0.02;
      if (vol >= 0.5) { vol = 0.5; clearInterval(fade); }
      music.volume = vol;
    }, 100);
  }

  function unlockAudio() {
    if (audioUnlocked) return;
    const p = music.play();
    if (p !== undefined) {
      p.then(() => {
        audioUnlocked = true;
        audioEnabled = true;
        audioControl.classList.add('on');
        audioControl.textContent = '♪ вкл';
        fadeIn();
        window.removeEventListener('mousemove', unlockAudio);
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('keydown', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
        window.removeEventListener('scroll', unlockAudio);
      }).catch(() => {});
    }
  }

  window.addEventListener('mousemove', unlockAudio);
  window.addEventListener('click', unlockAudio);
  window.addEventListener('keydown', unlockAudio);
  window.addEventListener('touchstart', unlockAudio);
  window.addEventListener('scroll', unlockAudio);

  tryAutoPlay();

  audioControl.addEventListener('click', (e) => {
    e.stopPropagation();
    if (audioEnabled) {
      music.pause();
      audioEnabled = false;
      audioControl.classList.remove('on');
      audioControl.textContent = '♪ выкл';
    } else {
      music.play().then(() => {
        audioEnabled = true;
        audioControl.classList.add('on');
        audioControl.textContent = '♪ вкл';
      }).catch(() => {});
    }
  });
</script>

</body>
</html>
