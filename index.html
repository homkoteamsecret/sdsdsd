<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>связь</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
    cursor: default;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.015);
    pointer-events: none;
    animation: flicker 5s infinite;
    z-index: 1;
  }

  @keyframes flicker {
    0%, 100% { opacity: 0; }
    48% { opacity: 0; }
    50% { opacity: 1; }
    52% { opacity: 0; }
    88% { opacity: 0; }
    89% { opacity: 1; }
    90% { opacity: 0; }
    91% { opacity: 1; }
    92% { opacity: 0; }
  }

  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(255,255,255,0.015) 3px,
      rgba(255,255,255,0.015) 4px
    );
    pointer-events: none;
    z-index: 2;
    animation: scanMove 8s linear infinite;
  }

  @keyframes scanMove {
    0% { transform: translateY(0); }
    100% { transform: translateY(4px); }
  }

  #bg-noise {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.06;
    mix-blend-mode: screen;
    background: linear-gradient(90deg, #ff0044 0%, transparent 20%, transparent 80%, #00ffff 100%);
    animation: bgShift 6s ease-in-out infinite;
  }

  @keyframes bgShift {
    0%, 100% { transform: translateX(-10%); opacity: 0.04; }
    50% { transform: translateX(10%); opacity: 0.09; }
  }

  #vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
  }

  #scan-bar {
    position: fixed;
    left: 0;
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,0.08);
    pointer-events: none;
    z-index: 4;
    animation: scanBar 7s linear infinite;
  }

  @keyframes scanBar {
    0% { top: -5%; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { top: 105%; opacity: 0; }
  }

  #container {
    text-align: center;
    position: relative;
    z-index: 10;
  }

  #visual-entity {
    width: 180px;
    height: auto;
    display: block;
    margin: 0 auto;
    image-rendering: pixelated;
    filter: grayscale(1) contrast(1.2);
    opacity: 0.7;
  }

  #hidden-text {
    margin-top: 30px;
    font-size: 24px;
    letter-spacing: 8px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 10px #fff, 0 0 20px #ff6b9d;
    opacity: 0;
    transition: opacity 1.5s ease;
  }

  #hidden-text.visible {
    opacity: 1;
  }

  #audio-control {
    position: fixed;
    bottom: 15px;
    right: 15px;
    color: #222;
    font-size: 11px;
    cursor: pointer;
    z-index: 100;
    transition: color 0.3s;
    user-select: none;
  }

  #audio-control:hover { color: #666; }
  #audio-control.on { color: #ff6b9d; }
</style>
</head>
<body>

<div id="bg-noise"></div>
<div id="vignette"></div>
<div id="scan-bar"></div>

<div id="container">
  
  <div id="hidden-text">SPAWN</div>
</div>

<div id="audio-control">♪ выкл</div>

<audio id="bgMusic" loop>
  <source src="april2012.ogg" type="audio/ogg">
</audio>

<script>
  let idleTimer;
  const hiddenText = document.getElementById('hidden-text');
  const audioControl = document.getElementById('audio-control');
  const bgMusic = document.getElementById('bgMusic');
  const imgEntity = document.getElementById('visual-entity');

  // Обход кэша: добавляем уникальный параметр, чтобы заставить браузер сделать реальный запрос в сеть/диск
  imgEntity.src = "he.png?v=" + new Date().getTime();

  function resetIdleTimer() {
    hiddenText.classList.remove('visible');
    clearTimeout(idleTimer);
    
    idleTimer = setTimeout(() => {
      hiddenText.classList.add('visible');
    }, 4000);
  }

  window.addEventListener('mousemove', resetIdleTimer);
  window.addEventListener('keydown', resetIdleTimer);

  audioControl.addEventListener('click', () => {
    if (bgMusic.paused) {
      bgMusic.play().catch(() => {});
      audioControl.innerText = '♪ вкл';
      audioControl.classList.add('on');
    } else {
      bgMusic.pause();
      audioControl.innerText = '♪ выкл';
      audioControl.classList.remove('on');
    }
  });

  resetIdleTimer();
</script>

</body>
</html>
