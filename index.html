<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    cursor: default;
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- pr.gif по центру, уменьшенный --- */
  #bg-gif {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 55vw;
    height: 55vh;
    max-width: 640px;
    max-height: 640px;
    object-fit: contain;
    z-index: 0;
    pointer-events: none;
    user-select: none;
  }

  /* --- Скрытая кнопка в правом нижнем углу --- */
  #hidden-btn {
    position: fixed;
    bottom: 0; right: 0;
    width: 72px; height: 72px;
    background: transparent;
    border: none; outline: none;
    cursor: default;
    z-index: 100;
    opacity: 0;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>

<img id="bg-gif" src="pr.gif" alt="">

<button id="hidden-btn" aria-label=""></button>

<audio id="bgMusic" loop preload="auto">
  <source src="april2012.ogg" type="audio/ogg">
</audio>

<script>
  const music = document.getElementById('bgMusic');
  const hiddenBtn = document.getElementById('hidden-btn');

  let playing = false;

  hiddenBtn.addEventListener('click', () => {
    if (playing) {
      music.pause();
      playing = false;
    } else {
      music.play().then(() => {
        playing = true;
      }).catch((err) => {
        console.error('Play failed:', err);
      });
    }
  });
</script>

</body>
</html>
