<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: default;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.015);
    pointer-events: none;
    animation: flicker 5s infinite;
    z-index: 1;
  }

  @keyframes flicker {
    0%, 100% { opacity: 0; }
    48% { opacity: 0; }
    50% { opacity: 1; }
    52% { opacity: 0; }
    88% { opacity: 0; }
    89% { opacity: 1; }
    90% { opacity: 0; }
    91% { opacity: 1; }
    92% { opacity: 0; }
  }

  #vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
    background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.95) 100%);
  }

  #scanlines {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(255,255,255,0.03) 3px,
      rgba(255,255,255,0.03) 4px
    );
  }

  #flicker {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.01);
    pointer-events: none;
    z-index: 4;
    animation: flicker 5s infinite;
  }

  #container {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
  }

  #man {
    width: 250px;
    height: auto;
    image-rendering: pixelated;
    opacity: 0.9;
    cursor: pointer;
    transition: transform 0.2s;
    user-select: none;
    -webkit-user-drag: none;
  }

  #man:hover {
    transform: scale(1.05);
  }

  #dialog {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.95);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
  }

  #dialog.active {
    opacity: 1;
    pointer-events: auto;
  }

  #dialog-text {
    color: #fff;
    font-size: 24px;
    letter-spacing: 3px;
    margin-bottom: 50px;
    text-align: center;
    line-height: 2;
    padding: 0 40px;
    max-width: 800px;
  }

  #dialog-text.pink { color: #ff6b9d; }
  #dialog-text.gray { color: #666; }
  #dialog-text.white { color: #fff; }

  .hidden-letter {
    position: fixed;
    font-size: 32px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    z-index: 100;
    color: transparent;
    opacity: 0;
    cursor: default;
    user-select: none;
    padding: 15px;
    transition: opacity 0.3s ease, color 0.3s ease;
  }

  .hidden-letter:hover,
  .hidden-letter.revealed {
    color: #ff6b9d;
    opacity: 1;
  }

  #r1 { top: 12%; left: 10%; }
  #e1 { top: 18%; right: 12%; }
  #m1 { top: 38%; left: 15%; }
  #e2 { top: 50%; right: 18%; }
  #m2 { top: 62%; left: 12%; }
  #b1 { bottom: 28%; right: 15%; }
  #e3 { bottom: 18%; left: 20%; }
  #r2 { bottom: 10%; right: 10%; }

  @media (max-width: 600px) {
    .hidden-letter {
      font-size: 28px;
      padding: 20px;
    }
    #r1 { top: 5%; left: 15%; }
    #e1 { top: 12%; right: 15%; }
    #m1 { top: 22%; left: 20%; }
    #e2 { top: 32%; right: 20%; }
    #m2 { bottom: 32%; left: 20%; }
    #b1 { bottom: 22%; right: 20%; }
    #e3 { bottom: 12%; left: 15%; }
    #r2 { bottom: 5%; right: 15%; }

    #man { width: 180px; }
  }

  #audio-control {
    position: fixed;
    bottom: 15px;
    right: 15px;
    color: #222;
    font-size: 11px;
    cursor: pointer;
    z-index: 100;
    transition: color 0.3s;
    user-select: none;
    font-family: 'Courier New', monospace;
  }

  #audio-control:hover { color: #666; }
  #audio-control.on { color: #ff6b9d; }
</style>
</head>
<body>

<div id="vignette"></div>
<div id="scanlines"></div>
<div id="flicker"></div>

<div class="hidden-letter" id="r1">r</div>
<div class="hidden-letter" id="e1">e</div>
<div class="hidden-letter" id="m1">m</div>
<div class="hidden-letter" id="e2">e</div>
<div class="hidden-letter" id="m2">m</div>
<div class="hidden-letter" id="b1">b</div>
<div class="hidden-letter" id="e3">e</div>
<div class="hidden-letter" id="r2">r</div>

<div id="container">
  <img id="man" src="man.gif" alt="">
</div>

<div id="dialog">
  <div id="dialog-text"></div>
</div>

<div id="audio-control">♪ выкл</div>

<audio id="bgMusic" loop>
  <source src="man.mp3" type="audio/mpeg">
</audio>

<script>
  let audioEnabled = false;
  let audioUnlocked = false;
  let inDialog = false;
  let clickCount = 0;

  const music = document.getElementById('bgMusic');
  const audioControl = document.getElementById('audio-control');
  const man = document.getElementById('man');
  const dialog = document.getElementById('dialog');
  const dialogText = document.getElementById('dialog-text');

  document.querySelectorAll('.hidden-letter').forEach(letter => {
    letter.addEventListener('touchstart', function() {
      this.classList.add('revealed');
    });
    letter.addEventListener('click', function() {
      this.classList.add('revealed');
    });
  });

  music.volume = 0;

  man.addEventListener('click', () => {
    if (inDialog) return;
    inDialog = true;
    clickCount++;

    dialogText.className = 'gray';

    if (clickCount === 1) {
      dialogText.textContent = 'ещё не время';
    } else {
      dialogText.textContent = 'скоро';
    }

    dialog.classList.add('active');
    setTimeout(() => {
      dialog.classList.remove('active');
      inDialog = false;
    }, 2500);
  });

  function tryAutoPlay() {
    music.volume = 0;
    const p = music.play();
    if (p !== undefined) {
      p.then(() => {
        audioEnabled = true;
        audioUnlocked = true;
        audioControl.classList.add('on');
        audioControl.textContent = '♪ вкл';
        fadeIn();
      }).catch(() => {
        audioEnabled = false;
      });
    }
  }

  function fadeIn() {
    let vol = 0;
    const fade = setInterval(() => {
      vol += 0.02;
      if (vol >= 0.5) {
        vol = 0.5;
        clearInterval(fade);
      }
      music.volume = vol;
    }, 100);
  }

  function unlockAudio() {
    if (audioUnlocked) return;
    const p = music.play();
    if (p !== undefined) {
      p.then(() => {
        audioUnlocked = true;
        audioEnabled = true;
        audioControl.classList.add('on');
        audioControl.textContent = '♪ вкл';
        fadeIn();
        window.removeEventListener('mousemove', unlockAudio);
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('keydown', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
        window.removeEventListener('scroll', unlockAudio);
      }).catch(() => {});
    }
  }

  window.addEventListener('mousemove', unlockAudio);
  window.addEventListener('click', unlockAudio);
  window.addEventListener('keydown', unlockAudio);
  window.addEventListener('touchstart', unlockAudio);
  window.addEventListener('scroll', unlockAudio);

  tryAutoPlay();

  audioControl.addEventListener('click', (e) => {
    e.stopPropagation();
    if (audioEnabled) {
      music.pause();
      audioEnabled = false;
      audioControl.classList.remove('on');
      audioControl.textContent = '♪ выкл';
    } else {
      music.play().then(() => {
        audioEnabled = true;
        audioControl.classList.add('on');
        audioControl.textContent = '♪ вкл';
      }).catch(() => {});
    }
  });
</script>

</body>
</html>
