<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }

  /* Виньетка */
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.95) 100%);
  }

  /* Сканлайны */
  #scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(255,255,255,0.03) 3px,
      rgba(255,255,255,0.03) 4px
    );
  }

  /* Мерцание */
  #flicker {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    background: rgba(255,255,255,0.02);
    animation: flicker 5s infinite;
  }

  @keyframes flicker {
    0%, 100% { opacity: 0; }
    48% { opacity: 0; }
    50% { opacity: 1; }
    52% { opacity: 0; }
    88% { opacity: 0; }
    89% { opacity: 1; }
    90% { opacity: 0; }
    91% { opacity: 1; }
    92% { opacity: 0; }
  }

  /* Гастер */
  #gaster {
    position: relative;
    z-index: 10;
    width: 300px;
    height: auto;
    image-rendering: pixelated;
    opacity: 0.9;
    user-select: none;
    -webkit-user-drag: none;
    animation: breathe 6s ease-in-out infinite, pulse 3s ease-in-out infinite;
    filter: drop-shadow(0 0 20px #fff) drop-shadow(0 0 40px #888);
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50%      { transform: scale(1.03); opacity: 1; }
  }

  @keyframes pulse {
    0%, 100% {
      filter: drop-shadow(0 0 20px #fff) drop-shadow(0 0 40px #888);
    }
    50% {
      filter: drop-shadow(0 0 40px #fff) drop-shadow(0 0 80px #888);
    }
  }
</style>
</head>
<body>

<div id="vignette"></div>
<div id="scanlines"></div>
<div id="flicker"></div>

<img id="gaster" src="gaster.png" alt="">

<audio id="gasterMusic" loop>
  <source src="gaster.mp3" type="audio/mpeg">
</audio>

<script>
// ============================================================
//  МУЗЫКА — запуск при первом клике
// ============================================================
const music = document.getElementById('gasterMusic');
music.volume = 0;

function playMusic() {
  music.play().then(() => {
    let vol = 0;
    const fade = setInterval(() => {
      vol += 0.02;
      if (vol >= 0.4) { vol = 0.4; clearInterval(fade); }
      music.volume = vol;
    }, 100);
  }).catch(() => {});
}

// пробуем сразу
playMusic();

// если заблокировано — при первом клике
document.addEventListener('click', playMusic, { once: true });
document.addEventListener('keydown', playMusic, { once: true });

// ============================================================
//  КОНСОЛЬ
// ============================================================
console.log('%c...', 'color: #333; font-size: 20px;');
console.log('%cон был первым.', 'color: #888; font-size: 14px;');
console.log('%cон стёрт.', 'color: #888; font-size: 14px;');
console.log('%cно он везде.', 'color: #fff; font-size: 14px; text-shadow: 0 0 10px #fff;');
</script>

</body>
</html>
