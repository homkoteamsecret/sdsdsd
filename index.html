<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: default;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.015);
    pointer-events: none;
    animation: flicker 5s infinite;
    z-index: 1;
  }

  @keyframes flicker {
    0%, 100% { opacity: 0; }
    48% { opacity: 0; }
    50% { opacity: 1; }
    52% { opacity: 0; }
    88% { opacity: 0; }
    89% { opacity: 1; }
    90% { opacity: 0; }
    91% { opacity: 1; }
    92% { opacity: 0; }
  }

  #vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
    background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.95) 100%);
  }

  #scanlines {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(255,255,255,0.03) 3px,
      rgba(255,255,255,0.03) 4px
    );
  }

  #flicker {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.01);
    pointer-events: none;
    z-index: 4;
    animation: flicker 5s infinite;
  }

  #container {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
    gap: 60px;
  }

  #dess {
    width: 250px;
    height: auto;
    image-rendering: pixelated;
    opacity: 0.9;
    animation: breathe 6s ease-in-out infinite;
    user-select: none;
    -webkit-user-drag: none;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.02); opacity: 1; }
  }

  #timer-block {
    text-align: center;
  }

  #timer-label {
    display: block;
    font-size: 13px;
    letter-spacing: 10px;
    color: #555;
    margin-bottom: 25px;
    font-family: 'Courier New', monospace;
  }

  #timer {
    font-family: 'Courier New', monospace;
    font-size: 72px;
    font-weight: bold;
    letter-spacing: 8px;
    color: #fff;
    text-shadow: 
      0 0 10px #fff,
      0 0 20px #fff,
      0 0 40px #ff6b9d,
      0 0 80px #ff6b9d,
      0 0 120px #ff6b9d;
    animation: pulse 2s ease-in-out infinite;
    text-align: center;
    line-height: 1.2;
  }

  @keyframes pulse {
    0%, 100% { 
      text-shadow: 
        0 0 10px #fff,
        0 0 20px #fff,
        0 0 40px #ff6b9d,
        0 0 80px #ff6b9d,
        0 0 120px #ff6b9d;
    }
    50% { 
      text-shadow: 
        0 0 20px #fff,
        0 0 40px #fff,
        0 0 80px #ff6b9d,
        0 0 160px #ff6b9d,
        0 0 240px #ff6b9d;
    }
  }

  #timer.soon {
    color: #ff6b9d;
    text-shadow: 
      0 0 10px #ff6b9d,
      0 0 20px #ff6b9d,
      0 0 40px #ff0044,
      0 0 80px #ff0044,
      0 0 120px #ff0044;
  }

  #timer.open {
    color: #ff6b9d;
    font-size: 42px;
    letter-spacing: 10px;
    animation: pulse 1s ease-in-out infinite;
  }

  #timer-sub {
    display: block;
    font-size: 14px;
    letter-spacing: 6px;
    color: #444;
    margin-top: 25px;
    font-family: 'Courier New', monospace;
  }

  /* ===== КНОПКА BLOG ===== */
  #blog-link {
    display: inline-block;
    color: #333;
    font-size: 14px;
    letter-spacing: 6px;
    text-decoration: none;
    padding: 12px 40px;
    border: 1px solid #222;
    transition: all 0.4s;
    font-family: 'Courier New', monospace;
    margin-top: 20px;
  }

  #blog-link:hover {
    color: #ff6b9d;
    border-color: #ff6b9d;
    letter-spacing: 10px;
  }

  #audio-control {
    position: fixed;
    bottom: 15px;
    right: 15px;
    color: #222;
    font-size: 11px;
    cursor: pointer;
    z-index: 100;
    transition: color 0.3s;
    user-select: none;
    font-family: 'Courier New', monospace;
  }

  #audio-control:hover { color: #666; }
  #audio-control.on { color: #ff6b9d; }
</style>
</head>
<body>

<div id="vignette"></div>
<div id="scanlines"></div>
<div id="flicker"></div>

<div id="container">
  <img id="dess" src="dess.png" alt="">
  
  <div id="timer-block">
    <span id="timer-label">SOMETHING WILL HAPPEN IN</span>
    <div id="timer">00:00:00:00</div>
    <span id="timer-sub">she can't get out alone</span>
  </div>

  <a href="/blog" id="blog-link">blog</a>
</div>

<div id="audio-control">♪ выкл</div>

<audio id="bgMusic" loop>
  <source src="dess.mp3" type="audio/mpeg">
</audio>

<audio id="timerSound" loop>
  <source src="timer.mp3" type="audio/mpeg">
</audio>

<script>
  const TARGET = new Date('2026-10-01T08:00:00Z').getTime();

  const timerEl = document.getElementById('timer');
  const timerLabel = document.getElementById('timer-label');
  const timerSub = document.getElementById('timer-sub');

  function updateTimer() {
    const now = Date.now();
    const diff = TARGET - now;

    if (diff <= 0) {
      timerEl.textContent = 'IT IS TIME';
      timerEl.className = 'open';
      timerLabel.textContent = '';
      timerSub.textContent = 'help her';
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

    timerEl.textContent = 
      String(days).padStart(2, '0') + ':' +
      String(hours).padStart(2, '0') + ':' +
      String(minutes).padStart(2, '0') + ':' +
      String(seconds).padStart(2, '0');

    if (diff < 1000 * 60 * 60 * 24) {
      timerEl.className = 'soon';
    }
  }

  updateTimer();
  setInterval(updateTimer, 1000);

  let audioEnabled = false;
  let audioUnlocked = false;
  let timerSoundEnabled = false;

  const music = document.getElementById('bgMusic');
  const timerSound = document.getElementById('timerSound');
  const audioControl = document.getElementById('audio-control');

  music.volume = 0;
  timerSound.volume = 0;

  function tryAutoPlay() {
    music.volume = 0;
    const p = music.play();
    if (p !== undefined) {
      p.then(() => {
        audioEnabled = true;
        audioUnlocked = true;
        audioControl.classList.add('on');
        audioControl.textContent = '♪ вкл';
        fadeInMusic();
        startTimerSound();
      }).catch(() => { audioEnabled = false; });
    }
  }

  function fadeInMusic() {
    let vol = 0;
    const fade = setInterval(() => {
      vol += 0.02;
      if (vol >= 0.4) { vol = 0.4; clearInterval(fade); }
      music.volume = vol;
    }, 100);
  }

  function startTimerSound() {
    timerSound.volume = 0;
    const p = timerSound.play();
    if (p !== undefined) {
      p.then(() => {
        timerSoundEnabled = true;
        let vol = 0;
        const fade = setInterval(() => {
          vol += 0.02;
          if (vol >= 0.4) { vol = 0.4; clearInterval(fade); }
          timerSound.volume = vol;
        }, 100);
      }).catch(() => {});
    }
  }

  function unlockAudio() {
    if (audioUnlocked) return;
    const p = music.play();
    if (p !== undefined) {
      p.then(() => {
        audioUnlocked = true;
        audioEnabled = true;
        audioControl.classList.add('on');
        audioControl.textContent = '♪ вкл';
        fadeInMusic();
        startTimerSound();
        window.removeEventListener('mousemove', unlockAudio);
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('keydown', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
        window.removeEventListener('scroll', unlockAudio);
      }).catch(() => {});
    }
  }

  window.addEventListener('mousemove', unlockAudio);
  window.addEventListener('click', unlockAudio);
  window.addEventListener('keydown', unlockAudio);
  window.addEventListener('touchstart', unlockAudio);
  window.addEventListener('scroll', unlockAudio);

  tryAutoPlay();

  audioControl.addEventListener('click', (e) => {
    e.stopPropagation();
    if (audioEnabled) {
      music.pause();
      timerSound.pause();
      audioEnabled = false;
      timerSoundEnabled = false;
      audioControl.classList.remove('on');
      audioControl.textContent = '♪ выкл';
    } else {
      music.play().then(() => {
        audioEnabled = true;
        audioControl.classList.add('on');
        audioControl.textContent = '♪ вкл';
        if (!timerSoundEnabled) {
          startTimerSound();
        } else {
          timerSound.play();
        }
      }).catch(() => {});
    }
  });
</script>

</body>
</html>
