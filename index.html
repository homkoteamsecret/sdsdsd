<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>haha</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .haha {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    cursor: pointer;
  }
</style>
</head>
<body>

  <img src="haha.jpg" alt="haha" class="haha" id="haha" />
  <audio id="snd" src="haha.ogg" preload="auto"></audio>

<script>
  const img = document.getElementById('haha');
  const snd = document.getElementById('snd');

  img.addEventListener('click', () => {
    try { snd.currentTime = 0; snd.play(); } catch(e) {}
  });
</script>
</body>
</html>
