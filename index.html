<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Малиновый Гастер</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: 'Courier New', monospace;
    cursor: default;
  }

  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.95) 100%);
  }

  #scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(255,107,157,0.03) 3px,
      rgba(255,107,157,0.03) 4px
    );
  }

  #flicker {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    background: rgba(255,107,157,0.02);
    animation: flicker 5s infinite;
  }

  @keyframes flicker {
    0%, 100% { opacity: 0; }
    48% { opacity: 0; }
    50% { opacity: 1; }
    52% { opacity: 0; }
    88% { opacity: 0; }
    89% { opacity: 1; }
    90% { opacity: 0; }
    91% { opacity: 1; }
    92% { opacity: 0; }
  }

  /* ЗАГОЛОВОК */
  #title {
    position: relative;
    z-index: 10;
    color: #ff6b9d;
    font-size: clamp(20px, 4vw, 36px);
    font-weight: bold;
    letter-spacing: 6px;
    margin-bottom: 30px;
    text-align: center;
    text-shadow:
      0 0 10px #ff6b9d,
      0 0 20px #ff6b9d,
      0 0 40px #ff0044;
    animation: titlePulse 2s ease-in-out infinite;
  }

  @keyframes titlePulse {
    0%, 100% {
      text-shadow:
        0 0 10px #ff6b9d,
        0 0 20px #ff6b9d,
        0 0 40px #ff0044;
    }
    50% {
      text-shadow:
        0 0 20px #ff6b9d,
        0 0 40px #ff6b9d,
        0 0 80px #ff0044,
        0 0 120px #ff0044;
    }
  }

  /* ГАСТЕР */
  #gaster {
    position: relative;
    z-index: 10;
    width: 280px;
    height: auto;
    image-rendering: pixelated;
    user-select: none;
    -webkit-user-drag: none;
    animation: bob 3s ease-in-out infinite;
    filter:
      drop-shadow(0 0 20px #ff6b9d)
      drop-shadow(0 0 40px #ff0044)
      drop-shadow(0 0 80px #ff0044);
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-12px) rotate(2deg); }
  }

  /* ТЕКСТ */
  #subtitle {
    position: relative;
    z-index: 10;
    color: #ff6b9d;
    font-size: 14px;
    letter-spacing: 4px;
    margin-top: 30px;
    text-align: center;
    line-height: 2.2;
    text-shadow: 0 0 10px #ff6b9d;
    white-space: pre-line;
    opacity: 0;
    animation: textIn 2s ease-in 1s forwards;
  }

  @keyframes textIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ПОДПИСЬ ВНИЗУ */
  #files {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 30px;
    font-size: 11px;
    letter-spacing: 3px;
    color: #333;
    opacity: 0;
    animation: textIn 2s ease-in 2s forwards;
  }

  #files .file {
    color: #444;
    text-decoration: none;
    transition: color 0.3s;
  }

  #files .file:hover {
    color: #ff6b9d;
    text-shadow: 0 0 10px #ff6b9d;
  }
</style>
</head>
<body>

<div id="vignette"></div>
<div id="scanlines"></div>
<div id="flicker"></div>

<div id="title">МАЛИНОВЫЙ ГАСТЕР</div>

<img id="gaster" src="gaster.png" alt="">

<div id="subtitle">undraeel захвачен.

малина стала стражем.
она смотрит.
она ждёт.
она — малина.</div>

<div id="files">
  <a class="file" href="/gaster.png" target="_blank">gaster.png</a>
  <a class="file" href="/gaster.mp3" target="_blank">gaster.mp3</a>
</div>

<audio id="gasterMusic" loop>
  <source src="gaster.mp3" type="audio/mpeg">
</audio>

<script>
localStorage.setItem('undraeel_captured', 'true');
localStorage.setItem('captured_by', 'malina');

const music = document.getElementById('gasterMusic');
music.volume = 0;

function playMusic() {
  music.play().then(() => {
    let vol = 0;
    const fade = setInterval(() => {
      vol += 0.02;
      if (vol >= 0.3) { vol = 0.3; clearInterval(fade); }
      music.volume = vol;
    }, 100);
  }).catch(() => {});
}

playMusic();
document.addEventListener('click', playMusic, { once: true });
document.addEventListener('keydown', playMusic, { once: true });

console.log('%cМАЛИНОВЫЙ ГАСТЕР', 'color: #ff6b9d; font-size: 24px; font-weight: bold; letter-spacing: 6px;');
console.log('');
console.log('%cОБНАРУЖЕН ЗАХВАТ', 'color: #ff0044; font-size: 14px; font-weight: bold;');
console.log('%cundraeel: потерян.', 'color: #888; font-size: 12px;');
console.log('%cзахватчик: малина.', 'color: #ff6b9d; font-size: 12px;');
console.log('');
console.log('%cона была первой.', 'color: #888; font-size: 12px;');
console.log('%cона стёрта.', 'color: #888; font-size: 12px;');
console.log('%cно она везде.', 'color: #ff6b9d; font-size: 12px; text-shadow: 0 0 10px #ff6b9d;');
</script>

</body>
</html>
