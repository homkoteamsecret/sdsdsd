<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>твой друг</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .v {
    width: 220px;
    height: 220px;
    object-fit: contain;
    cursor: pointer;
    animation: pulse 2s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255, 217, 59, 0.5));
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50%      { transform: scale(1.15); opacity: 1; }
  }
  .secret {
    position: fixed;
    bottom: 16px;
    left: 16px;
    font-family: monospace;
    font-size: 11px;
    color: #000;
    user-select: text;
    letter-spacing: 1px;
  }
  .secret::selection {
    background: #fff;
    color: #000;
  }
</style>
</head>
<body>

  <img src="v.png" alt="v" class="v" id="v" />
  <audio id="snd" src="v.mp3" preload="auto"></audio>

  <div class="secret">что-то произойдёт через 3 дня</div>

<script>
  const v = document.getElementById('v');
  const snd = document.getElementById('snd');
  v.addEventListener('click', () => {
    try { snd.currentTime = 0; snd.play(); } catch(e) {}
  });
</script>
</body>
</html>
